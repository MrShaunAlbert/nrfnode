CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="nrfnode"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Zap-filen ateranvands fran Nordics template-sample (en minimal nod utan egna kluster).
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/../nrf/samples/matter/template/src/default_zap/template.zap"

CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=n
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_BT_DEVICE_NAME="nrfnode"

CONFIG_DK_LIBRARY=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_USE_SEGGER_RTT=n

# Prototypen kor utan bootloader och utan fabriksdata (testcertifikat).
CONFIG_CHIP_ENABLE_READ_CLIENT=y
CONFIG_CHIP_FACTORY_DATA_NONE=y
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n

# RAM-trimning
CONFIG_OPENTHREAD_BLE_TCAT=n
CONFIG_CHIP_MAX_FABRICS=2
CONFIG_CHIP_MAX_ACTIVE_CASE_CLIENTS=2
CONFIG_CHIP_MAX_ACTIVE_DEVICES=2
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_SHELL=n
CONFIG_BT_BUF_EVT_RX_COUNT=6

# Controllern genererar egna certifikat (SubjectKeyIdentifier anvander SHA-1)
CONFIG_PSA_WANT_ALG_SHA_1=y

# Controllerns sessioner och pooler allokeras pa Matters heap
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=40960

CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_CHIP_TASK_STACK_SIZE=12288
CONFIG_CHIP_CRYPTO_USE_X509=y
CONFIG_MBEDTLS_PK_WRITE_C=y

CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_FULL_LOGS=n
CONFIG_OPENTHREAD_DEBUG=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_OPENTHREAD_SRP_SERVER=y
CONFIG_OPENTHREAD_DNSSD_SERVER=y
CONFIG_OPENTHREAD_ENABLE_SERVICE=y
CONFIG_OPENTHREAD_NETDATA_PUBLISHER=y

# OLED sensor UI and runtime clock
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_COUNTER=y
CONFIG_EVENTS=y
CONFIG_RETAINED_MEM=y
CONFIG_CRC=y

# Latest sensor snapshot, alarm, UI settings, and Matter settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y

# Flash/RAM-trimning
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_LOG_FILE_NAME=n
CONFIG_ASSERT=n
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_OPENTHREAD_NETDIAG_CLIENT=n
CONFIG_OPENTHREAD_NETDIAG_VENDOR_INFO=n
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=n
CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=n
CONFIG_NCS_SAMPLE_MATTER_TEST_EVENT_TRIGGERS=n
CONFIG_CHIP_SYSTEM_PACKETBUFFER_POOL_SIZE=10

