# --- Knappar ---
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

# --- I2C (PAN1780 OLED bring-up) ---
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# --- RTC (klocka) ---
CONFIG_COUNTER=y
CONFIG_EVENTS=y

# --- Alarm (lagras i flash via NVS) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_RETAINED_MEM=y
CONFIG_CRC=y

# --- Loggning / debug ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_ASSERT=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
